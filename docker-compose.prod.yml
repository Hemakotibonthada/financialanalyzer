# Application stack for ONE environment (single VM, e.g. Oracle Cloud Always-Free ARM).
#
# The same file deploys both environments. ENV_NAME selects which:
#
#   ENV_NAME=fin  DOMAIN=fin.circuvent.com   <- main branch, production
#   ENV_NAME=dev  DOMAIN=dev.circuvent.com   <- dev branch, staging
#
# Each environment is fully isolated: its own containers, its own MongoDB and
# Redis, its own named volumes (prefixed by COMPOSE_PROJECT_NAME). Staging can
# therefore never read or corrupt production data.
#
# There are deliberately no host port bindings here. TLS and routing belong to
# the shared edge proxy in docker-compose.edge.yml, which reaches these
# services through the `${ENV_NAME}-api` / `${ENV_NAME}-web` network aliases.
#
# Bring up with:  bash deploy/deploy.sh fin   (or `dev`)

services:
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
    networks:
      default: {}
      edge:
        aliases:
          - ${ENV_NAME}-web

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5001"
      APP_ENV: ${ENV_NAME}
      MONGODB_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/financial_analyzer?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL: https://${DOMAIN}
      CLIENT_URL: https://${DOMAIN}
      CORS_ORIGIN: https://${DOMAIN}
      SECURE_COOKIES: "true"
      TRUST_PROXY: "true"
      APP_NAME: ${APP_NAME:-Financial Analyzer}
      # Optional integrations - safe to leave blank (features degrade gracefully)
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    expose:
      - "5001"
    volumes:
      - api_uploads:/app/uploads
      - api_logs:/app/logs
    networks:
      default: {}
      edge:
        aliases:
          - ${ENV_NAME}-api

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - default
    healthcheck:
      test: ["CMD", "mongosh", "-u", "root", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand(''ping'')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    networks:
      - default

networks:
  # Private per-environment network: mongo and redis are unreachable from the
  # other environment and from the edge proxy.
  default: {}
  edge:
    name: circuvent_edge
    external: true

volumes:
  mongo_data:
  redis_data:
  api_uploads:
  api_logs: