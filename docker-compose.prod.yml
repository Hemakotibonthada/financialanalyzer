# Production stack for finserve.circuvent.com (single VM, e.g. Oracle Cloud Always-Free ARM).
# Caddy terminates TLS and routes: /api/* + /socket.io/* -> api, everything else -> web (SPA).
# Bring up with:  bash deploy/deploy.sh   (which passes --env-file .env.prod)

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5001"
      MONGODB_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/financial_analyzer?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL: https://${DOMAIN}
      CLIENT_URL: https://${DOMAIN}
      CORS_ORIGIN: https://${DOMAIN}
      SECURE_COOKIES: "true"
      APP_NAME: ${APP_NAME:-Financial Analyzer}
      # Optional integrations — safe to leave blank (features degrade gracefully)
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    expose:
      - "5001"
    volumes:
      - api_uploads:/app/uploads
      - api_logs:/app/logs

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "-u", "root", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
  api_uploads:
  api_logs:
  caddy_data:
  caddy_config:
