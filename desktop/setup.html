<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Analyzer - Initial Setup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .setup-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      overflow: hidden;
    }

    .setup-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px 30px;
      text-align: center;
    }

    .setup-header h1 {
      font-size: 28px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .setup-header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .setup-content {
      padding: 40px 30px;
    }

    .setup-step {
      margin-bottom: 30px;
    }

    .step-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-number {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
    }

    .storage-options {
      display: grid;
      gap: 15px;
    }

    .storage-option {
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .storage-option:hover {
      border-color: #667eea;
      background: #f9fafb;
    }

    .storage-option.selected {
      border-color: #667eea;
      background: #eef2ff;
    }

    .storage-option input[type="radio"] {
      position: absolute;
      opacity: 0;
    }

    .storage-option-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .storage-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .option-local .storage-icon {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    .option-online .storage-icon {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    }

    .storage-option-title {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
    }

    .storage-option-description {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
      margin-left: 52px;
    }

    .storage-features {
      margin-left: 52px;
      margin-top: 10px;
    }

    .feature {
      font-size: 12px;
      color: #059669;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feature.online {
      color: #2563eb;
    }

    .feature::before {
      content: "✓";
      font-weight: bold;
    }

    .info-box {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 8px;
      padding: 15px;
      font-size: 13px;
      color: #92400e;
      line-height: 1.5;
    }

    .info-box strong {
      color: #78350f;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    .btn {
      flex: 1;
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      border: 3px solid #f3f4f6;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="setup-container">
    <div class="setup-header">
      <h1>Welcome to Financial Analyzer</h1>
      <p>Let's set up your storage preferences</p>
    </div>

    <div class="setup-content">
      <div class="setup-step">
        <div class="step-title">
          <span class="step-number">1</span>
          Choose Your Storage Location
        </div>

        <div class="storage-options">
          <!-- Local Storage Option -->
          <label class="storage-option option-local" id="option-local">
            <input type="radio" name="storage" value="local" checked>
            <div class="storage-option-header">
              <div class="storage-icon">💾</div>
              <div class="storage-option-title">Local Storage</div>
            </div>
            <div class="storage-option-description">
              Store all your financial data locally on this computer using MongoDB.
            </div>
            <div class="storage-features">
              <div class="feature">Complete privacy - data never leaves your device</div>
              <div class="feature">Faster performance</div>
              <div class="feature">Works offline</div>
              <div class="feature">No internet required</div>
            </div>
          </label>

          <!-- Online Storage Option -->
          <label class="storage-option option-online" id="option-online">
            <input type="radio" name="storage" value="online">
            <div class="storage-option-header">
              <div class="storage-icon">☁️</div>
              <div class="storage-option-title">Online Storage (Cloud)</div>
            </div>
            <div class="storage-option-description">
              Store your data securely in the cloud using Google Firebase.
            </div>
            <div class="storage-features">
              <div class="feature online">Access from anywhere</div>
              <div class="feature online">Automatic backups</div>
              <div class="feature online">Sync across devices</div>
              <div class="feature online">Secure cloud storage</div>
            </div>
          </label>
        </div>
      </div>

      <div class="setup-step">
        <div class="info-box">
          <strong>Note:</strong> You can change this setting later from the app's settings menu. 
          Your data can be migrated between storage options at any time.
        </div>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Setting up your storage...</p>
      </div>

      <div class="button-group" id="button-group">
        <button class="btn btn-secondary" onclick="window.close()">Cancel</button>
        <button class="btn btn-primary" id="btn-continue" onclick="saveSettings()">Continue</button>
      </div>
    </div>
  </div>

  <script>
    // Handle radio button selection UI
    document.querySelectorAll('.storage-option').forEach(option => {
      option.addEventListener('click', function() {
        document.querySelectorAll('.storage-option').forEach(opt => {
          opt.classList.remove('selected');
        });
        this.classList.add('selected');
        this.querySelector('input[type="radio"]').checked = true;
      });
    });

    // Set initial selection
    document.getElementById('option-local').classList.add('selected');

    async function saveSettings() {
      const selectedStorage = document.querySelector('input[name="storage"]:checked').value;
      
      // Show loading
      document.getElementById('loading').classList.add('active');
      document.getElementById('button-group').style.display = 'none';

      // Save settings via IPC
      try {
        await window.electron.saveStorageSettings({
          storageType: selectedStorage,
          setupCompleted: true,
          setupDate: new Date().toISOString()
        });

        // Close setup window after short delay
        setTimeout(() => {
          window.close();
        }, 1000);
      } catch (error) {
        console.error('Failed to save settings:', error);
        alert('Failed to save settings. Please try again.');
        document.getElementById('loading').classList.remove('active');
        document.getElementById('button-group').style.display = 'flex';
      }
    }
  </script>
</body>
</html>
